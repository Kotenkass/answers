apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: kotenkass-answers-runner
  namespace: github-runners
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1500m
          memory: 3Gi
      env:
        - name: KUBECONFIG
          value: /var/run/secrets/kubernetes.io/serviceaccount/kubeconfig
        - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
          value: "false"
      volumeMounts:
        - name: runner-kubeconfig
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
        - name: runner-kubeconfig
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 86400
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
      containerMode: kubernetes
      workVolumeClaimTemplate:
        storageClassName: csi-cinder-classic
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
      serviceAccountName: github-runner-sa
      repository: Kotenkass/answers
      labels:
        - self-hosted
        - linux
        - k8s
        - answers
