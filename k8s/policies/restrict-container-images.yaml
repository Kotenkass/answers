apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-container-images
  annotations:
    policies.kyverno.io/title: Restrict Container Images
    policies.kyverno.io/category: Image Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Requires tagged images from the configured registry, blocks latest tags,
      and enforces the policy for all matching workloads.
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Image tags must be explicit; ':latest' or no tag is not allowed."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"

    - name: require-image-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              names:
                - "postgres-dev-*"
                - "redis-master-*"
      validate:
        message: "Images must be pulled from the approved registry: docker.io/anikolaevdo/."
        pattern:
          spec:
            =(initContainers):
              - image: "docker.io/anikolaevdo/*"
            containers:
              - image: "docker.io/anikolaevdo/*"
