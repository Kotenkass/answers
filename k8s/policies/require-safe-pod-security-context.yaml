apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-safe-pod-security-context
  annotations:
    policies.kyverno.io/title: Require Safe Pod Security Context
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Blocks privileged containers and runAsNonRoot=false. Enforces the policy
      for all matching workloads.
spec:
  validationFailureAction: enforce
  background: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kafka
                - clickhouse-operator-system
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  privileged: "false"
            containers:
              - =(securityContext):
                  privileged: "false"

    - name: disallow-run-as-non-root-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "runAsNonRoot must not be set to false."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  runAsNonRoot: "!false"
            containers:
              - =(securityContext):
                  runAsNonRoot: "!false"
