apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    environment: dev
---
apiVersion: v1
kind: Secret
metadata:
  name: answers-dev-env
  namespace: dev
type: Opaque
stringData:
  KAFKA_BOOTSTRAP: kafka-kafka-bootstrap.kafka.svc:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: answers
  namespace: dev
  labels:
    app: answers
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: answers
      environment: dev
  template:
    metadata:
      labels:
        app: answers
        environment: dev
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: docker-hub-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: answers
          image: docker.io/anikolaevdo/answers:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: postgres-dev.dev.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: users
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-dev-env
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SSLMODE
              value: disable
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                secretKeyRef:
                  name: answers-dev-env
                  key: KAFKA_BOOTSTRAP
            - name: IMAGE_TAG
              value: dev
            - name: LOG_LEVEL
              value: debug
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: answers
  namespace: dev
  labels:
    app: answers
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: answers
    environment: dev
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP