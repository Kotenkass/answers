name: Dev Deploy

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/answers
      IMAGE_TAG: dev
      COSIGN_PUB: ${{ vars.COSIGN_PUB }}
      NAMESPACE: dev
      KUBECONFIG: /tmp/kubeconfig
      MANIFEST_PATH: k8s/Actions/manifest-dev.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
              --scanners vuln,secret \
              --severity CRITICAL \
              --exit-code 1 \
              --format table \
              "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Push scanned Docker image
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Ensure Kyverno policy admin RBAC
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f k8s/rbac/kyverno-policy-admin.yaml

      - name: Apply Kyverno image security policies
        run: |
          ./scripts/render-kyverno-policies.sh rendered-k8s/policies k8s/policies
          kubectl --kubeconfig "$KUBECONFIG" apply -f rendered-k8s/policies

      - name: Create or update answers dev Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic answers-dev-env \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=KAFKA_BOOTSTRAP="${{ secrets.KAFKA_BOOTSTRAP }}" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Create or update Docker Hub pull secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret docker-registry docker-hub-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="https://index.docker.io/v1/" \
            --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply dev manifests
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/answers answers="${IMAGE_NAME}:${IMAGE_TAG}" --namespace "$NAMESPACE"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/answers --namespace "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/answers --namespace "$NAMESPACE" --timeout=180s

      - name: Health check
        run: |
          POD="$(kubectl --kubeconfig "$KUBECONFIG" get pod -l app=answers,environment=dev --namespace "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}')"
          kubectl --kubeconfig "$KUBECONFIG" wait --for=condition=Ready "pod/$POD" --namespace "$NAMESPACE" --timeout=180s
          kubectl --kubeconfig "$KUBECONFIG" logs --tail=50 "$POD" --namespace "$NAMESPACE"