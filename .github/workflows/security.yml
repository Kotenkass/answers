name: Security scanning

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-security:
    name: Image security - build and Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Docker metadata
        id: meta
        run: |
          image_name="${IMAGE_NAME,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            tag="${tag,,}"
          else
            tag="pr-${GITHUB_RUN_ID}"
          fi
          image="${image_name}:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      - name: Run Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
              --scanners vuln,secret \
              --severity CRITICAL \
              --exit-code 1 \
              --format table \
              "${{ steps.meta.outputs.image }}"

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
            semgrep \
              --config p/golang \
              --config p/security-audit \
              --severity ERROR \
              --sarif \
              --output semgrep.sarif \
              --error \
              --exclude vendor/ \
              --exclude '*_test.go' \
              .

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-sarif-${{ github.event.repository.name }}
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: error

  sca:
    name: SCA - govulncheck and Trivy filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run govulncheck
        id: govulncheck
        run: |
          exit_code=0
          go run \
            golang.org/x/vuln/cmd/govulncheck \
            -format json \
            ./... > govulncheck.json || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Run Trivy filesystem SARIF report
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs \
              --scanners vuln,secret \
              --format sarif \
              --output /src/trivy.sarif \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              /src

      - name: Run Trivy blocking check
        id: trivy
        run: |
          exit_code=0
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              /src || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - name: Fail SCA if security tools found issues
        if: >-
          steps.govulncheck.outputs.exit_code != '0' ||
          steps.trivy.outputs.exit_code != '0'
        run: exit 1

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sca-reports-${{ github.event.repository.name }}
          path: |
            govulncheck.json
            trivy.sarif
          retention-days: 14
          if-no-files-found: warn
