name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/answers:latest

  deploy:
    runs-on: ubuntu-latest

    needs: build
    env:
      MANIFEST_PATH: k8s/Actions/manifest.yaml
      KUBECONFIG: /tmp/kubeconfig
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update answers environment Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic answers-env \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=KAFKA_BOOTSTRAP="$KAFKA_BOOTSTRAP" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/answers answers="${{ secrets.DOCKER_HUB_USERNAME }}/answers:latest"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment answers
